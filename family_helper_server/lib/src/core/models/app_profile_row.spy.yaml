class: AppProfileRow
table: app_profile
fields:
  authUserId: String
  displayName: String
  timezone: String
  locale: String, defaultModel='en', defaultPersist='en'
  avatarMedia: MediaObjectRow?, relation(optional)
  analyticsOptIn: bool
  createdAt: DateTime
  updatedAt: DateTime
  deletedAt: DateTime?
  version: int
indexes:
  app_profile_auth_user_id_idx:
    fields: authUserId
    unique: true
