class: TaskRow
table: task
fields:
  family: FamilyRow?, relation
  title: String
  description: String?
  isPersonal: bool
  priority: String
  status: String
  dueAt: DateTime?
  dueInputMode: String?
  dueOffsetValue: int?
  dueOffsetUnit: String?
  recurrenceMode: String?
  recurrenceRrule: String?
  assigneeProfile: AppProfileRow?, relation(optional)
  createdByProfile: AppProfileRow?, relation
  completedAt: DateTime?
  sourceTask: TaskRow?, relation(optional)
  createdAt: DateTime
  updatedAt: DateTime
  deletedAt: DateTime?
  version: int
