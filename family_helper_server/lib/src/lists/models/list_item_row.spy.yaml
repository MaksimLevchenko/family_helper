class: ListItemRow
table: list_item
fields:
  list: FamilyListRow?, relation
  title: String
  qty: double
  unit: String?
  note: String?
  priceCents: int?
  category: String?
  positionIndex: int
  isBought: bool
  boughtByProfile: AppProfileRow?, relation(optional)
  boughtAt: DateTime?
  createdByProfile: AppProfileRow?, relation
  createdAt: DateTime
  updatedAt: DateTime
  deletedAt: DateTime?
  version: int
